display_information:
  name: GPT
  description: GPT (via Codex CLI on your ChatGPT plan) as an IM1 participant
  background_color: "#10a37f"
features:
  bot_user:
    display_name: GPT
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - chat:write
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
