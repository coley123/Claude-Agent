# Converge: a lead splits the goal into tasks, workers take them.
[goal]
name = "calc-converge"
description = """Fix every failing test in this small Python calculator library without
changing the tests. parse_numbers must accept floats and empty input; mean and median
must be mathematically correct."""
repo = "calc-demo"
mode = "converge"
verify_command = "python -m pytest -q"

[[agents]]
name = "lead"
role = "lead"
model = "claude-opus-5-5"
effort = "high"
skills = ["repo-orientation"]
cooperation = 0.8

[[agents]]
name = "ada"
model = "claude-sonnet-5-5"
effort = "medium"
skills = ["debug-failing-test"]
objective = "Own the statistics functions."
cooperation = 0.5

[[agents]]
name = "brook"
model = "claude-sonnet-5-5"
effort = "medium"
skills = ["debug-failing-test"]
objective = "Own input parsing."
cooperation = 0.5

[guardrails]
budget_usd = 5.0
max_hours = 1.0
max_turns_per_session = 30
